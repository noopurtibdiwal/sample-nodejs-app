pipeline:
  name: dag-parallel
  identifier: dagparallel
  projectIdentifier: noopurdev
  orgIdentifier: default
  tags: {}
  stages:
    - stage:
        name: Unit_Test_and_SAST
        identifier: Unit_Test_and_SAST
        description: ""
        type: Custom
        spec:
          execution:
            steps:
              - step:
                  type: ShellScript
                  name: run_unit_test_sast
                  identifier: run_unit_test_sast
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: |2-
                                                    echo "Unit_Test_and_SAST started: $(date -u +%T)"
                                                    sleep 60
                                                    echo "Unit_Test_and_SAST finished: $(date -u +%T)"
                    environmentVariables: []
                    outputVariables: []
                  timeout: 10m
        tags: {}
